[project]
name = "controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.1",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "logging>=0.4.9.6",
    "nut2>=2.1.1",
    "requests>=2.32.5",
    "rich>=13.9.4",
    "typing>=3.10.0.0",
    "uv2>=1.88.1133",
    "uvicorn>=0.32.0",
    "wakeonlan>=3.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]
# 瀏覽器 E2E 測試（tests/e2e），需要另外下載 Chromium：uv run --group e2e playwright install chromium
e2e = [
    "playwright>=1.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
